<script>
const C = JSON.parse(document.getElementById("config").textContent);
const L = JSON.parse(document.getElementById("items").textContent);
const COLOR = Object.fromEntries(C.choices.map(([v, , c]) => [v, c]));
const LABEL = Object.fromEntries(C.choices.map(([v, t]) => [v, t]));
// A slide may carry its own question and choices (a decision); every other slide uses the page's.
const pick = (i, v) => ((L[i] && L[i].choices) || C.choices).find(c => c[0] === v) || [];
const colorOf = (i, v) => pick(i, v)[2] || "";
const labelOf = (i, v) => pick(i, v)[1] || "";
const LAST = L.length + 1;   // slide 0: the start; 1 to L.length: the items; LAST: send the feedback
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// A reader's marks, kept in their own browser (a convenience: the page works without it).
let state = {};
try { state = JSON.parse(localStorage.getItem(C.key) || "{}") || {}; } catch (e) { console.warn("[review] storage not readable", e); }
const save = () => { try { localStorage.setItem(C.key, JSON.stringify(state)); } catch (e) { console.warn("[review] storage not writable", e); } };
const marked = () => L.filter((_, i) => state[i]?.v).length;
let at = 0, tab = C.tab;

// Will's Google Form (Nov 5, "2"): each answer saves for Will as the reader clicks it. The form takes a plain POST with
// no login. A no-cors POST hides the reply, so a network error is the only failure the page can see.
let reader = "";
try {
  reader = localStorage.getItem("review-reader") || "";
  if (!reader) { reader = "r" + Math.random().toString(36).slice(2, 8); localStorage.setItem("review-reader", reader); }
} catch (e) { reader = "r" + Math.random().toString(36).slice(2, 8); }
const timers = {};
const status = msg => { const el = document.getElementById("saved"); if (el) el.textContent = msg; };
async function send(item, choice, note) {
  if (!C.form) return;
  const f = C.form.entries, body = new URLSearchParams();
  body.set(f.page, C.head); body.set(f.item, item); body.set(f.choice, choice || ""); body.set(f.note, note || "");
  body.set(f.name, (state.name || "").trim()); body.set(f.reader, reader);
  status("Saving...");
  const t = performance.now();
  try {
    await fetch(C.form.post, { method: "POST", mode: "no-cors", body });
    status("Saved for Will.");
    console.log("[review] saved", { page: C.key, item, choice, ms: Math.round(performance.now() - t) });
  } catch (e) {
    status("Not saved. Use Copy my feedback on the last slide.");
    console.error("[review] save failed", { page: C.key, item, error: String(e) });
  }
}
const itemLabel = i => `${C.noun} ${i + 1}: ${L[i].title} (${L[i].ref})`;
function sendItem(i, wait) {
  clearTimeout(timers[i]);
  timers[i] = setTimeout(() => { const s = state[i] || {}; send(itemLabel(i), s.v ? labelOf(i, s.v) : "", s.note); }, wait);
}
const nameField = () => `<label for="name">Your name</label>
  <input type="text" id="name" placeholder="Your name" autocomplete="name" value="${esc(state.name || "")}">`;

function itemSlide(i) {
  const x = L[i], s = state[i] || {};
  const t = x.tabs.find(([k]) => k === tab) || x.tabs[0];
  return `<div class="kicker">${C.noun} ${i + 1} of ${L.length}${x.kicker ? ` · ${esc(x.kicker)}` : ""}</div>
    <h2>${esc(x.title)}</h2>
    <div class="seg" role="tablist">${x.tabs.map(([k, w]) => `<button type="button" data-tab="${k}" class="${k === t[0] ? "on" : ""}" role="tab" aria-selected="${k === t[0]}">${esc(w)}</button>`).join("")}</div>
    ${t[2]}
    <div class="fb">
      <label id="c${i}">${esc(x.question || C.question)}</label>
      <div class="choices" role="group" aria-labelledby="c${i}">${(x.choices || C.choices).map(([v, w, c]) => `<button type="button" data-i="${i}" data-v="${v}" data-c="${c}" aria-pressed="${s.v === v}">${esc(w)}</button>`).join("")}</div>
      <label for="n${i}">${esc(C.noteLabel)}</label>
      <textarea id="n${i}" data-i="${i}" placeholder="${esc(C.notePlaceholder)}">${esc(s.note || "")}</textarea>
      ${C.form ? `<p class="small" id="saved" role="status" aria-live="polite" style="margin:8px 0 0"></p>` : ""}
    </div>`;
}
function lastSlide() {
  return `<div class="kicker">Send your feedback</div>
    <h2>You marked ${marked()} of ${L.length} ${C.nouns}</h2>
    <ul class="marks">${L.map((x, i) => {
      const v = state[i]?.v;
      return `<li><a href="#${i + 1}">${i + 1}. ${esc(x.title)}</a><span class="tag ${v ? colorOf(i, v) : "none"}">${v ? esc(labelOf(i, v)) : "Not marked"}</span></li>`;
    }).join("")}</ul>
    ${C.form ? `<p class="say">Your answers saved for Will as you clicked them. You do not need to send anything.</p>` : ""}
    ${nameField()}
    <p style="margin-top:14px"><button class="big" id="copy" type="button">Copy my feedback</button><span class="done" id="done" role="status" aria-live="polite"></span></p>
    <p class="small">${C.form ? "To also send it in Slack, paste it to Will there." : "Then paste it to Will in Slack."}</p>`;
}
function dots() {
  const d = [`<button type="button" data-go="0" aria-label="Start" ${at === 0 ? 'aria-current="true"' : ""}></button>`];
  L.forEach((_, i) => d.push(`<button type="button" data-go="${i + 1}" class="${state[i]?.v ? colorOf(i, state[i].v) : ""}" aria-label="${C.noun} ${i + 1}" ${at === i + 1 ? 'aria-current="true"' : ""}></button>`));
  d.push(`<button type="button" data-go="${LAST}" aria-label="Send your feedback" ${at === LAST ? 'aria-current="true"' : ""}></button>`);
  document.getElementById("dots").innerHTML = d.join("");
}
function where() {
  document.getElementById("where").textContent = at === 0 ? "Start" : at === LAST ? "Send your feedback" : `${C.noun} ${at} of ${L.length} · ${marked()} marked`;
}
function show(n) {
  at = Math.max(0, Math.min(LAST, n));
  document.getElementById("slide").innerHTML = at === 0 ? C.start.replace("<!--name-->", nameField()) : at === LAST ? lastSlide() : itemSlide(at - 1);
  document.getElementById("back").disabled = at === 0;
  const next = document.getElementById("next");
  next.disabled = at === LAST;
  next.textContent = at === L.length ? "Finish ›" : "Next ›";
  where(); dots();
  scrollTo(0, 0);
  if (location.hash !== `#${at}`) history.replaceState(null, "", `#${at}`);
  console.log("[review] slide", { page: C.key, at, tab, marked: marked() });
}
const go = n => show(n);
document.getElementById("back").addEventListener("click", () => go(at - 1));
document.getElementById("next").addEventListener("click", () => go(at + 1));
addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (!Number.isNaN(n) && n !== at) show(n); });
// The left and right arrows move the slides (decks get the arrow keys), but never while someone types.
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight") { e.preventDefault(); go(at + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(at - 1); }
});
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]");
  if (g) { go(+g.dataset.go); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb) {
    tab = tb.dataset.tab;
    const y = scrollY;
    show(at);
    scrollTo(0, Math.min(y, 120));
    return;
  }
  const b = e.target.closest(".choices button");
  if (b) {
    const i = +b.dataset.i;
    state[i] = { ...(state[i] || {}), v: b.dataset.v };
    b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    save(); dots(); where();
    sendItem(i, 0);
    console.log("[review] marked", { page: C.key, item: i + 1, ref: L[i].ref, choice: b.dataset.v });
  }
  if (e.target.id === "copy") copy();
});
document.addEventListener("input", e => {
  if (e.target.matches("textarea[data-i]")) { const i = +e.target.dataset.i; state[i] = { ...(state[i] || {}), note: e.target.value }; save(); sendItem(i, 1500); }
  if (e.target.id === "name") {
    state.name = e.target.value; save();
    clearTimeout(timers.name);
    timers.name = setTimeout(() => send("(the reader's name)", "", ""), 1500);
  }
});
function text() {
  const who = (state.name || "").trim() || "(no name)";
  const lines = [`${C.head}: feedback from ${who}`];
  L.forEach((x, i) => {
    const s = state[i] || {};
    lines.push(`${i + 1}. ${x.title} (${x.ref}): ${s.v ? labelOf(i, s.v) : "not marked"}`);
    if ((s.note || "").trim()) lines.push(`   ${s.note.trim().replace(/\n+/g, " / ")}`);
  });
  lines.push(`Marked ${marked()} of ${L.length}.`);
  return lines.join("\n");
}
async function copy() {
  const t = text(), done = document.getElementById("done");
  try {
    await navigator.clipboard.writeText(t);
  } catch (e) {
    // Older browsers: copy through a hidden text box.
    const ta = Object.assign(document.createElement("textarea"), { value: t });
    document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove();
    console.warn("[review] clipboard API failed; used the fallback", e);
  }
  done.textContent = "Copied. Paste it to Will.";
  console.log("[review] feedback copied", { page: C.key, chars: t.length, marked: marked() });
